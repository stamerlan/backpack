[project]
name = "backpack"
dynamic = ["version"]
description = "Backpacking trip planner"
requires-python = ">=3.14"
dependencies = [
    "pywebview>=6.2,<7",
    "certifi",
    "gpxpy>=1.6,<2",
    "geopy>=2.4,<3",
    "keyring>=25.7,<26",
    "overpy>=0.7,<1",
    "pydantic-ai-slim[google]>=2.21,<3",
    "babel>=2.18,<3",
]
readme = "README.rst"

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-mypy>=1.0,<2",
    "pyinstaller>=6.22,<7",
]

[project.scripts]
backpack = "core.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs", "babel>=2.18,<3"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0"

[tool.hatch.build.hooks.vcs]
version-file = "src/core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "core._version"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "webview.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "Microsoft.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "AppKit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "Foundation.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PyObjCTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gpxpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "geopy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "overpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "keyring.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_ai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gen_run"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--mypy"
testpaths = ["src", "tests"]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]
