name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: >-
          npx vitest run
          --reporter=default
          --reporter=junit
          --outputFile.junit=vitest-report.xml

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: ui/vitest-report.xml

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [python-tests, ui-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          path: reports

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*.xml
