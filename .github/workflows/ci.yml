name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Run pytest
        run: sh test.sh pytest

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: bin/*/pytest-report.xml

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Run Vitest
        run: sh test.sh vitest

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: bin/*/vitest-report.xml

  build-windows-x64:
    name: Build windows-x64 package
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, ui-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build package
        shell: cmd
        run: build.bat --app

      - name: Get version
        id: ver
        shell: bash
        run: |
          bin/windows-x64/.venv/Scripts/python.exe - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version
          print(f"version={version('backpack')}")
          PY

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: backpack-${{ steps.ver.outputs.version }}-windows-x64
          path: bin/windows-x64/backpack-*.zip

  build-windows-arm64:
    name: Build windows-arm64 package
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, ui-tests]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # cryptography has no ARM64 Windows wheels, so pip builds it from
      # source against this OpenSSL.
      - name: Install OpenSSL
        shell: cmd
        run: |
          set "DIR=%RUNNER_TEMP%\openssl-arm64"
          set "VCPKG=%VCPKG_INSTALLATION_ROOT%\vcpkg.exe"
          mkdir "%DIR%" || exit /b 1
          cd /d "%DIR%" || exit /b 1
          "%VCPKG%" new --application || exit /b 1
          "%VCPKG%" add port openssl || exit /b 1
          "%VCPKG%" install --triplet arm64-windows-static-md || exit /b 1
          >> "%GITHUB_ENV%" echo OPENSSL_DIR=%DIR%\vcpkg_installed\arm64-windows-static-md
          >> "%GITHUB_ENV%" echo OPENSSL_STATIC=1

      - name: Build package
        shell: cmd
        run: build.bat --app

      - name: Get version
        id: ver
        shell: bash
        run: |
          bin/windows-arm64/.venv/Scripts/python.exe - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version
          print(f"version={version('backpack')}")
          PY

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: backpack-${{ steps.ver.outputs.version }}-windows-arm64
          path: bin/windows-arm64/backpack-*.zip

  build-macos-arm64:
    name: Build macos-arm64 package
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, ui-tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build package
        run: sh build.sh --app

      - name: Get version
        id: ver
        run: |
          bin/macos-arm64/.venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version
          print(f"version={version('backpack')}")
          PY

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: backpack-${{ steps.ver.outputs.version }}-macos-arm64
          path: bin/macos-arm64/backpack-*.zip

  release:
    name: Publish release
    # Only for v* tags; a manual dispatch just leaves the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-x64, build-windows-arm64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: backpack-*
          path: packages
          merge-multiple: true

      - name: Stage packages
        run: |
          mkdir -p release
          find packages -name 'backpack-*.zip' -exec cp -v {} release/ \;

      - name: Generate launchers
        run: |
          python scripts/gen_run.py release \
            "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/run.sh
            release/run.ps1
          fail_on_unmatched_files: true
          # Keep /releases/latest on the last stable tag.
          prerelease: ${{ contains(github.ref_name, 'rc') }}

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [python-tests, ui-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          path: reports

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*.xml
