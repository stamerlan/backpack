name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest
        run: make pytest

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: bin/*/pytest-report.xml

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Run Vitest
        run: make vitest

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: bin/*/vitest-report.xml

  build:
    name: Build ${{ matrix.os }} package
    # Runs on a manual dispatch or a v* tag, once both test suites pass.
    # fail-fast cancels the other OS so a broken build never gets released.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, ui-tests]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: backpack-windows-x64
          - os: macos-latest
            artifact: backpack-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Install make
        if: runner.os == 'Windows'
        run: |
          winget install -e --id GnuWin32.Make `
            --accept-source-agreements --accept-package-agreements
          echo "C:\Program Files (x86)\GnuWin32\bin" >> $env:GITHUB_PATH

      - name: Build package
        run: make dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/**/backpack-*.zip

  release:
    name: Publish release
    # Only for v* tags; a manual dispatch just leaves the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: backpack-*
          path: packages
          merge-multiple: true

      - name: Stage packages
        run: |
          mkdir -p release
          find packages -name 'backpack-*.zip' -exec cp -v {} release/ \;

      - name: Generate launchers
        run: |
          python scripts/gen_run.py release \
            "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/run.sh
            release/run.ps1
          fail_on_unmatched_files: true
          # Keep /releases/latest on the last stable tag.
          prerelease: ${{ contains(github.ref_name, 'rc') }}

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [python-tests, ui-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          path: reports

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*.xml
