# Babel message extraction config.
# Scan all Python files under src/backpack/.
#
# Workflow (run from repo root):
#
#   Extract messages into the catalog template:
#     pybabel extract -F babel.cfg -o locales/backpack.pot .
#
#   Create a new locale (once per language):
#     pybabel init -i locales/backpack.pot -d locales -D backpack -l ru
#
#   Update existing catalogs after source changes:
#     pybabel update -i locales/backpack.pot -d locales -D backpack
#
#   Compile catalogs to binary .mo files:
#     pybabel compile -d locales -D backpack

[python: src/backpack/**.py]
