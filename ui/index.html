<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backpack</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body { margin: 0; }
    /* The app shell fills the window and every scrollable region owns its
     * own overflow, so the window itself must never scroll.
     */
    html, body { overflow: hidden; }
    /* Fluent mounts each dialog and drawer portal as a themed FluentProvider
     * directly on <body>, and that provider paints an opaque
     * colorNeutralBackground1 across the whole viewport. Behind the modal
     * scrim that reads as a solid grey wall that hides the app. The app's own
     * provider lives under #root, so clearing the background on body-level
     * providers keeps the window visible (shadowed) behind the overlay.
     */
    body > .fui-FluentProvider { background-color: transparent; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
